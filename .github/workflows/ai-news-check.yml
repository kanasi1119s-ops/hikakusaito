name: AI news check (Gemini)

# 毎朝9時頃(JST、UTC 0:03)に、Gemini API(Web検索つき)を使って
# 掲載プランの一部（日替わりで約15件、全件を約10日で一巡）の料金に
# 変化がないかを自動チェックします。
#
# 確信度の高い変化が見つかった場合のみ、専用ブランチを切って
# src/data/plans.json と src/data/news.json を更新し、人間の確認を待つ
# プルリクエストを自動作成します。変化がなければ何も行いません
# （コミットもプルリクエストも作られません）。
#
# 費用について: このワークフローはGOOGLE_API_KEYシークレットを使って
# Gemini APIを呼び出します（従量課金）。1回の実行で最大15件×1呼び出し程度です。

on:
  schedule:
    - cron: "3 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    if: ${{ vars.AI_NEWS_CHECK_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for pricing changes via Gemini API
        id: run_check
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY が設定されていないため、このジョブをスキップします。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/check-news.mjs
          CHANGED=$(node -e "console.log(require('./check-news-result.json').changed)")
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Validate updated data
        if: steps.run_check.outputs.changed == 'true'
        run: npm ci && npm test

      - name: Open pull request with detected changes
        if: steps.run_check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/ai-news-check-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add src/data/plans.json src/data/news.json
          git commit -m "data: Gemini APIによる自動チェックで料金変化の可能性を検知"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "[自動チェック] 料金変更の可能性を検知しました（要人間確認）" \
            --body "Gemini API(Web検索つき)による毎朝の自動チェックで、確信度の高い料金変化の可能性を検知しました。**マージ前に必ず出典URLで人間が確認してください。** AIの検知結果には誤りが含まれる可能性があります。" \
            --base main \
            --head "$BRANCH"
