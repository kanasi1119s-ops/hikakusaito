name: Deploy to GitHub Pages

# 注意: このワークフローはビルド成果物を用意するだけで、それ自体はサイトを公開しません。
# 実際に公開するには、人間が以下を行う必要があります。
#   1. GitHubのリポジトリ画面で Settings > Pages を開く
#   2. "Source" を "GitHub Actions" に設定する
#   3. リポジトリを公開する場合は Settings > General > Danger Zone で public化する
# これらの手順は docs/RELEASE.md にも記載しています。

on:
  workflow_dispatch: {}
  # Pagesの Source を "GitHub Actions" に設定すると、以後は main への push でも自動デプロイされます。
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
