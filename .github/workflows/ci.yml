name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (includes data schema validation)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check data freshness (warn only, does not fail the build)
        run: |
          node -e '
            const data = require("./src/data/plans.json");
            const now = new Date("2026-09-23");
            const ninetyDaysMs = 90 * 24 * 60 * 60 * 1000;
            let stale = [];
            for (const plan of data.plans) {
              const checked = new Date(plan.checkedAt);
              if (now.getTime() - checked.getTime() > ninetyDaysMs) {
                stale.push(`${plan.id} (checkedAt: ${plan.checkedAt})`);
              }
            }
            if (stale.length > 0) {
              console.log("::warning::以下のプランのデータ確認日が90日を超えています: " + stale.join(", "));
            } else {
              console.log("すべてのプランのデータは90日以内に確認されています。");
            }
          '

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
